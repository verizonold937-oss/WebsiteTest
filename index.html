<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REXZ-VOID | ADVANCED DEOB</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 15px;
        }
        .container {
            width: 100%; max-width: 850px;
            background: #0d0d0d; padding: 25px;
            border: 1px solid #1a1a1a; border-radius: 15px;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.05);
        }
        h1 { text-align: center; font-size: 1.4rem; letter-spacing: 4px; color: #fff; text-shadow: 0 0 10px #00ff00; }
        .box-label { font-size: 0.7rem; color: #555; margin-bottom: 5px; display: block; text-transform: uppercase; }
        textarea {
            width: 100%; height: 200px;
            background: #000; color: #00ff00;
            border: 1px solid #222; border-radius: 8px;
            padding: 12px; box-sizing: border-box;
            resize: none; font-size: 0.8rem; margin-bottom: 15px;
            outline: none; transition: 0.3s;
        }
        textarea:focus { border-color: #00ff00; box-shadow: 0 0 10px rgba(0, 255, 0, 0.1); }
        .actions { display: flex; gap: 12px; margin-bottom: 15px; }
        button {
            flex: 1; padding: 16px;
            background: #00ff00; color: #000;
            border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; font-size: 0.9rem;
            text-transform: uppercase;
        }
        button.secondary { background: #151515; color: #fff; border: 1px solid #333; }
        button:hover { filter: brightness(1.2); }
        .footer { font-size: 0.65rem; text-align: center; color: #444; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>💀 REXZ-VOID OMNI DEOB</h1>
        
        <span class="box-label">Input (Paste Code or Raw Link)</span>
        <textarea id="inputCode" placeholder="Paste script berantakan atau link raw di sini..."></textarea>
        
        <div class="actions">
            <button onclick="smartDeob()">DEOBFUSCATE & CLEAN</button>
            <button onclick="copyCode()" class="secondary">COPY RESULT</button>
        </div>

        <span class="box-label">Output (Readable Version)</span>
        <textarea id="outputCode" placeholder="Hasil yang sudah bersih akan muncul di sini..." readonly></textarea>
        
        <div class="footer">Rexz-Void Security Engine | Optimized for Infinix Smart 8</div>
    </div>

    <script>
        async function smartDeob() {
            const input = document.getElementById("inputCode").value.trim();
            const output = document.getElementById("outputCode");
            let rawData = input;

            if (!input) return alert("Mana kodenya, Raja?");

            // 1. FETCH LINK HANDLER
            if (input.startsWith("http")) {
                output.value = "⚡ Menarik data dari server...";
                try {
                    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(input)}`);
                    const json = await res.json();
                    rawData = json.contents;
                } catch (e) {
                    output.value = "❌ Gagal narik link!"; return;
                }
            }

            // 2. CORE DEOBFUSCATION LOGIC
            try {
                let cleaned = rawData
                    // Unpack Decimal \054
                    .replace(/\\(\d{1,3})/g, (match, dec) => String.fromCharCode(parseInt(dec, 10)))
                    // Unpack Hex \x41
                    .replace(/\\x([0-9A-Fa-f]{2})/g, (match, hex) => String.fromCharCode(parseInt(hex, 16)))
                    // Cleanup XOR Logic blocks (Simulasi sederhana)
                    .replace(/local v\d+\s*=\s*.*?;/g, (m) => "-- [VAR DEFINED]\n" + m)
                    // Beautify: Kasih enter setelah semicolon biar gak numpuk
                    .replace(/;/g, ";\n")
                    // Trash Removal
                    .replace(/--\[\[.*?\]\]/gs, "")
                    .replace(/--\s*\[REXZ-VOID CLEANED\]/g, "");

                // Tambahkan Header Identitas
                output.value = "-- [[ DEOBFUSCATED BY REXZ-VOID SYSTEM ]]\n\n" + cleaned;
            } catch (err) {
                output.value = "❌ ERROR: " + err.message;
            }
        }

        function copyCode() {
            const output = document.getElementById("outputCode");
            if (!output.value) return;
            navigator.clipboard.writeText(output.value);
            alert("Hasil disalin!");
        }
    </script>
</body>
</html>
