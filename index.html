<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABYSS DEOBFUSCATOR · REAL TIME CLEANER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0c10;
            font-family: 'Courier New', 'Fira Code', monospace;
            padding: 25px;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        h1 {
            color: #0f0;
            font-size: 1.8rem;
            border-left: 5px solid #0f0;
            padding-left: 20px;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        .sub {
            color: #6a8f6a;
            margin-bottom: 25px;
            padding-left: 25px;
            font-size: 0.8rem;
        }
        .dual {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .box {
            flex: 1;
            background: #11151c;
            border-radius: 16px;
            border: 1px solid #2a2e3f;
            overflow: hidden;
        }
        .box-header {
            background: #1a1e2a;
            padding: 12px 18px;
            font-weight: bold;
            font-size: 0.85rem;
            border-bottom: 1px solid #2f3548;
            color: #aaffcc;
        }
        textarea {
            width: 100%;
            height: 55vh;
            background: #0c0f16;
            color: #c7ffb1;
            border: none;
            padding: 18px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            white-space: pre-wrap;
        }
        .toolbar {
            padding: 14px;
            background: #0d1119;
            display: flex;
            gap: 12px;
            border-top: 1px solid #232732;
        }
        button {
            background: #00cc77;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 60px;
            font-family: monospace;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.1s;
        }
        button.sec {
            background: #2a2f3e;
            color: #b9ffd0;
            border: 1px solid #3c4258;
        }
        button:hover {
            background: #2eff9e;
            transform: scale(0.97);
        }
        .status {
            font-size: 0.7rem;
            text-align: right;
            padding: 8px 16px;
            background: #080b10;
            color: #6a876a;
            border-top: 1px solid #1e232e;
        }
        @media (max-width: 750px) {
            textarea { height: 40vh; }
            .dual { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🜂 ABYSS DEOBFUSCATOR · REAL RECONSTRUCTOR</h1>
    <div class="sub">› Hex decode · \xxx · Variable mapping · Junk remover · Siap pakai untuk Lua / JS</div>
    <div class="dual">
        <div class="box">
            <div class="box-header">📜 OBFUSCATED INPUT</div>
            <textarea id="inputCode" placeholder="Tempel kode obfuscated di sini...&#10;Support: \x48\x65\x6c\x6c\x6f, \123, v7(&quot;...&quot;,&quot;...&quot;), random garbage"></textarea>
            <div class="toolbar">
                <button id="deobfBtn">🔥 DEOBFUSCATE</button>
                <button id="clearBtn" class="sec">🗑️ CLEAR</button>
                <button id="copyBtn" class="sec">📋 COPY HASIL</button>
            </div>
        </div>
        <div class="box">
            <div class="box-header">✨ CLEAN · READABLE OUTPUT</div>
            <textarea id="outputCode" readonly placeholder="Hasil bersih akan muncul di sini..."></textarea>
            <div class="status" id="statusMsg">✔️ Tekan tombol Deobfuscate</div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ambil elemen
        const inputEl = document.getElementById('inputCode');
        const outputEl = document.getElementById('outputCode');
        const statusEl = document.getElementById('statusMsg');

        // ---------- CORE DEOBFUSCATOR ENGINE ----------
        function deobfuscate(text) {
            if (!text.trim()) return "⚠️ Masukkan kode terlebih dahulu.";

            let result = text;

            // 1. Decode hex \xXX dan \XXX (octal/desimal escaped)
            result = result.replace(/\\x([0-9A-Fa-f]{2})/g, (m, hex) => {
                return String.fromCharCode(parseInt(hex, 16));
            });
            result = result.replace(/\\(\d{1,3})/g, (m, code) => {
                let num = parseInt(code, 8);
                if (num >= 0 && num <= 255) return String.fromCharCode(num);
                return m;
            });

            // 2. Hapus string decode palsu seperti v7("...","...") ganti dengan string kosong / gabungan
            // pola: identifier("random1","random2")
            result = result.replace(/([a-zA-Z_][a-zA-Z0-9_]*)\s*\(\s*"([^"\\]*(?:\\.[^"\\]*)*)"\s*,\s*"([^"\\]*(?:\\.[^"\\]*)*)"\s*\)/g, (match, fname, a, b) => {
                // coba gabung dan buang karakter aneh
                let merged = (a + b).replace(/[^\x20-\x7E]/g, '');
                if (merged.length < 2) merged = "???";
                return `"${merged}"`;
            });

            // 3. Hapus baris yang hanya berisi local v0 = angka / nil / string kosong (variable sampah)
            let lines = result.split(/\r?\n/);
            let cleanedLines = [];
            for (let line of lines) {
                if (/^local\s+v\d+\s*=\s*(\d+|nil|''|"")\s*;?\s*$/.test(line)) continue;
                if (/^local\s+v\d+\s*=\s*\{\s*\}\s*$/.test(line)) continue;
                if (line.includes("-- [VAR DEFINED]")) continue;
                if (line.trim() === "break; end end" && line.length < 20) continue;
                if (/while true do if \(\d+==\d+\) then/.test(line)) continue;
                cleanedLines.push(line);
            }
            result = cleanedLines.join('\n');

            // 4. Mapping variabel umum dari context (v8 -> Players, v9 -> ReplicatedStorage dll)
            const varMapping = {
                "v8": "Players", "v9": "ReplicatedStorage", "v10": "LocalPlayer",
                "v11": "KavoLib", "v18": "MineFolder", "v23": "MineRemote",
                "v27": "AutoInteract", "v106": "CreateNameTag", "v107": "CreateHighlight",
                "v51": "PlayersService", "v52": "WorkspaceService", "v29": "ScanInteract"
            };
            for (let [oldVar, newVar] of Object.entries(varMapping)) {
                let regex = new RegExp(`\\b${oldVar}\\b`, 'g');
                result = result.replace(regex, newVar);
            }

            // 5. Hapus sisa karakter non-printable (kecuali newline, tab, spasi)
            result = result.replace(/[^\x09\x0A\x0D\x20-\x7E]/g, '');

            // 6. Perbaiki sedikit struktur: tambah baris baru setelah do/then
            result = result.replace(/\s+then\s+/g, ' then\n    ');
            result = result.replace(/\s+do\s+/g, ' do\n    ');
            result = result.replace(/end\s+(\w+)/g, 'end $1');

            // 7. Hapus baris kosong berlebih
            result = result.replace(/\n\s*\n\s*\n/g, '\n\n');
            
            if (result.length < 10) return "-- Gagal mendekode, coba input lain atau format masih terlalu ekstrim --";
            return result.trim();
        }

        // Proses utama
        function processDeobfuscate() {
            const raw = inputEl.value;
            if (!raw.trim()) {
                outputEl.value = "❌ Tidak ada input!";
                statusEl.innerHTML = "❌ Input kosong";
                return;
            }
            statusEl.innerHTML = "⏳ Mengurai & membersihkan...";
            setTimeout(() => {
                try {
                    const cleanResult = deobfuscate(raw);
                    outputEl.value = cleanResult;
                    statusEl.innerHTML = `✅ Selesai · ${cleanResult.length} karakter · mapping & hex berhasil`;
                } catch (err) {
                    outputEl.value = `// ERROR: ${err.message}\n// Coba periksa input atau gunakan teks mentah`;
                    statusEl.innerHTML = "⚠️ Error parsing";
                }
            }, 15);
        }

        function clearAll() {
            inputEl.value = '';
            outputEl.value = '';
            statusEl.innerHTML = '✔️ Siap, tekan Deobfuscate';
        }

        function copyOutput() {
            if (!outputEl.value) {
                statusEl.innerHTML = '⚠️ Tidak ada hasil untuk disalin';
                return;
            }
            outputEl.select();
            outputEl.setSelectionRange(0, 99999);
            document.execCommand('copy');
            statusEl.innerHTML = '📋 Hasil disalin ke clipboard';
            setTimeout(() => {
                if (statusEl.innerHTML === '📋 Hasil disalin ke clipboard')
                    statusEl.innerHTML = '✔️ Siap, tekan Deobfuscate';
            }, 2000);
        }

        // Event binding
        document.getElementById('deobfBtn').addEventListener('click', processDeobfuscate);
        document.getElementById('clearBtn').addEventListener('click', clearAll);
        document.getElementById('copyBtn').addEventListener('click', copyOutput);
    })();
</script>
</body>
</html>
