<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REXZ-VOID | OMNI DEOBFUSCATOR</title>
    <style>
        /* CSS AREA */
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 10px;
        }
        .container {
            width: 100%; max-width: 700px;
            background: #0f0f0f; padding: 25px;
            border: 1px solid #222; border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.05);
        }
        h1 { text-align: center; font-size: 1.2rem; letter-spacing: 3px; color: #fff; margin-bottom: 20px; }
        textarea {
            width: 100%; height: 180px;
            background: #000; color: #00ff00;
            border: 1px solid #333; border-radius: 8px;
            padding: 12px; box-sizing: border-box;
            resize: none; font-size: 0.85rem; margin-bottom: 15px;
            outline: none;
        }
        textarea:focus { border-color: #00ff00; }
        .actions { display: flex; gap: 10px; margin-bottom: 15px; }
        button {
            flex: 1; padding: 15px;
            background: #00ff00; color: #000;
            border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; font-size: 0.9rem;
            transition: 0.3s;
        }
        button.secondary { background: #1a1a1a; color: #fff; border: 1px solid #333; }
        button:hover { opacity: 0.8; }
        .status { font-size: 0.7rem; color: #555; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>💀 REXZ-VOID DEOB</h1>
        
        <textarea id="inputCode" placeholder="Paste Kode atau Link Raw (GitHub/Pastebin) di sini..."></textarea>
        
        <div class="actions">
            <button onclick="processDeob()">UNPACK & DEOB</button>
            <button onclick="copyCode()" class="secondary">COPY RESULT</button>
        </div>

        <textarea id="outputCode" placeholder="Hasil akan muncul di sini..." readonly></textarea>
        
        <div class="status">Rexz-Void Omni-System | Optimized for Infinix Smart 8</div>
    </div>

    <script>
        // JS AREA
        async function processDeob() {
            const input = document.getElementById("inputCode").value.trim();
            const output = document.getElementById("outputCode");
            let targetCode = input;

            if (!input) return alert("Input kosong, Raja!");

            // 1. Logic Fetch Link
            if (input.startsWith("http")) {
                output.value = "⚡ Membayangi Server... Menarik Data Raw...";
                try {
                    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(input)}`);
                    const data = await res.json();
                    targetCode = data.contents;
                } catch (err) {
                    output.value = "❌ GAGAL: Link tidak valid atau terblokir!";
                    return;
                }
            }

            // 2. Logic Deobfuscate Core
            try {
                let cleaned = targetCode
                    .replace(/\\(\d{3})/g, (match, dec) => String.fromCharCode(parseInt(dec, 10))) // Decimal \054
                    .replace(/\\x([0-9A-Fa-f]{2})/g, (match, hex) => String.fromCharCode(parseInt(hex, 16))) // Hex \x41
                    .replace(/--\[\[.*?\]\]/gs, "-- [REXZ-VOID CLEANED]"); // Trash Cleaner

                output.value = cleaned;
            } catch (err) {
                output.value = "❌ ERROR: " + err.message;
            }
        }

        function copyCode() {
            const output = document.getElementById("outputCode");
            if (!output.value) return alert("Belum ada hasil!");
            navigator.clipboard.writeText(output.value);
            alert("Berhasil disalin!");
        }
    </script>
</body>
</html>
